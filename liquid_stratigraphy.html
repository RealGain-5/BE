<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Stratigraphy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '\2022';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Liquid Stratigraphy</h1>
            <div class="subtitle">Deep time rendered as flowing computational geology</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <!-- Parameters Section (CUSTOM) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Strata Count</label>
                    <div class="slider-container">
                        <input type="range" id="strataCount" min="40" max="300" step="10" value="180" oninput="updateParam('strataCount', this.value)">
                        <span class="value-display" id="strataCount-value">180</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Undulation</label>
                    <div class="slider-container">
                        <input type="range" id="undulation" min="20" max="250" step="10" value="120" oninput="updateParam('undulation', this.value)">
                        <span class="value-display" id="undulation-value">120</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Frequency</label>
                    <div class="slider-container">
                        <input type="range" id="frequency" min="0.001" max="0.010" step="0.001" value="0.003" oninput="updateParam('frequency', this.value)">
                        <span class="value-display" id="frequency-value">0.003</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Detail</label>
                    <div class="slider-container">
                        <input type="range" id="detail" min="1" max="6" step="1" value="4" oninput="updateParam('detail', this.value)">
                        <span class="value-display" id="detail-value">4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Tectonic Force</label>
                    <div class="slider-container">
                        <input type="range" id="tectonicForce" min="0" max="1.0" step="0.05" value="0.40" oninput="updateParam('tectonicForce', this.value)">
                        <span class="value-display" id="tectonicForce-value">0.40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Fault Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="faultIntensity" min="0" max="80" step="5" value="40" oninput="updateParam('faultIntensity', this.value)">
                        <span class="value-display" id="faultIntensity-value">40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="opacity" min="10" max="80" step="5" value="35" oninput="updateParam('opacity', this.value)">
                        <span class="value-display" id="opacity-value">35</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (CUSTOM - geological palette) -->
            <div class="control-section">
                <h3>Geological Palette</h3>

                <div class="color-group">
                    <label>Deep Metamorphic</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#3d2215" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#3d2215</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Warm Sienna</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#8c5a35" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#8c5a35</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Ancient Seafloor</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#6b8464" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#6b8464</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Slate Marine</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#5a7a94" onchange="updateColor('color4', this.value)">
                        <span class="color-value" id="color4-value">#5a7a94</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Surface Chalk</label>
                    <div class="color-picker-container">
                        <input type="color" id="color5" value="#d4c9b0" onchange="updateColor('color5', this.value)">
                        <span class="color-value" id="color5-value">#d4c9b0</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom: 8px;">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row">
                    <button class="button tertiary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Depositing strata...</div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // PARAMETERS
        // =====================================================================

        let params = {
            seed: 12345,
            strataCount: 180,
            undulation: 120,
            frequency: 0.003,
            detail: 4,
            tectonicForce: 0.40,
            faultIntensity: 40,
            opacity: 35,
            colorPalette: ['#3d2215', '#8c5a35', '#6b8464', '#5a7a94', '#d4c9b0']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // =====================================================================
        // PRE-CALCULATED STATE
        // =====================================================================

        let faults = [];

        // =====================================================================
        // P5.JS ALGORITHM - LIQUID STRATIGRAPHY
        // =====================================================================

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            let loadingEl = document.querySelector('.loading');
            if (loadingEl) loadingEl.style.display = 'none';
            noLoop();
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            prepareFaults();
            renderStrata();
        }

        function prepareFaults() {
            let faultCount = floor(random(2, 5));
            faults = [];
            for (let f = 0; f < faultCount; f++) {
                faults.push({
                    x: random(width * 0.12, width * 0.88),
                    displacement: random(-params.faultIntensity, params.faultIntensity),
                    transitionWidth: random(40, 100)
                });
            }
        }

        function renderStrata() {
            // Warm geological paper background
            background(250, 245, 235);

            // Parse palette into p5 color objects
            let palette = params.colorPalette.map(function(c) { return color(c); });

            let margin = 70;
            let totalStrata = params.strataCount;

            for (let i = 0; i < totalStrata; i++) {
                let t = i / (totalStrata - 1); // 0 = bottom (deep), 1 = top (surface)
                let baseY = lerp(height - margin, margin, t);

                // ---- Color Interpolation through geological palette ----
                let paletteT = t * (palette.length - 1);
                let ci1 = floor(paletteT);
                let ci2 = min(ci1 + 1, palette.length - 1);
                let blend = paletteT - ci1;
                let baseColor = lerpColor(palette[ci1], palette[ci2], blend);

                // Subtle per-stratum color variation (geological impurity)
                let colorShift = (random() - 0.5) * 18;
                let r = red(baseColor) + colorShift;
                let g = green(baseColor) + colorShift * 0.7;
                let b = blue(baseColor) + colorShift * 0.5;

                // Slight stroke weight variation per stratum
                let sw = random(0.7, 1.6);
                strokeWeight(sw);
                stroke(r, g, b, params.opacity);
                noFill();

                // ---- Draw the stratum as a flowing curve ----
                beginShape();
                let step = 3;
                for (let x = -20; x <= width + 20; x += step) {

                    // --- Fractal noise displacement (multi-octave) ---
                    let displacement = 0;
                    let amp = 1.0;
                    let freq = 1.0;
                    let maxAmp = 0;
                    let noiseX = x * params.frequency;
                    let noiseY = i * 0.03;

                    for (let o = 0; o < params.detail; o++) {
                        displacement += (noise(noiseX * freq, noiseY * freq) - 0.5) * amp;
                        maxAmp += amp;
                        amp *= 0.5;
                        freq *= 2.0;
                    }
                    displacement = (displacement / maxAmp) * params.undulation * 2;

                    // --- Tectonic folding (low-frequency, large-scale) ---
                    let tectonicNoise = noise(x * 0.0008 + 500, i * 0.008 + 500);
                    let tectonic = (tectonicNoise - 0.5) * 2;
                    displacement += tectonic * params.tectonicForce * params.undulation;

                    // --- Fault displacement (smoothstep transitions) ---
                    for (let f = 0; f < faults.length; f++) {
                        let fault = faults[f];
                        let ft = (x - fault.x) / fault.transitionWidth + 0.5;
                        ft = constrain(ft, 0, 1);
                        ft = ft * ft * (3 - 2 * ft); // smoothstep
                        displacement += fault.displacement * (ft - 0.5);
                    }

                    vertex(x, baseY + displacement);
                }
                endShape();
            }
        }

        function draw() {
            // Static rendering - all work done in renderStrata()
        }

        // =====================================================================
        // UI CONTROL HANDLERS
        // =====================================================================

        function updateParam(paramName, value) {
            if (paramName === 'strataCount' || paramName === 'detail' ||
                paramName === 'faultIntensity' || paramName === 'opacity') {
                params[paramName] = parseInt(value);
            } else {
                params[paramName] = parseFloat(value);
            }
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            let index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        // =====================================================================
        // SEED CONTROL FUNCTIONS (FIXED)
        // =====================================================================

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        // =====================================================================
        // RESET & EXPORT
        // =====================================================================

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            // Update all sliders
            var sliders = ['strataCount', 'undulation', 'frequency', 'detail',
                           'tectonicForce', 'faultIntensity', 'opacity'];
            for (var s = 0; s < sliders.length; s++) {
                var id = sliders[s];
                document.getElementById(id).value = params[id];
                document.getElementById(id + '-value').textContent = params[id];
            }

            // Update all color pickers
            for (var c = 0; c < params.colorPalette.length; c++) {
                var cid = 'color' + (c + 1);
                document.getElementById(cid).value = params.colorPalette[c];
                document.getElementById(cid + '-value').textContent = params.colorPalette[c];
            }

            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('liquid-stratigraphy-seed-' + params.seed, 'png');
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
